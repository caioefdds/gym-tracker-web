server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Static assets get long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public build identity (frontend SHA injected at image build)
    location = /version {
        gzip off;
        proxy_pass http://backend:8080/version;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Length;
        sub_filter_types application/json;
        sub_filter '"backend"' '"frontend":{"sha":"__GIT_SHA__","shortSha":"__GIT_SHORT_SHA__","builtAt":"__BUILD_TIME__"},"backend"';
        sub_filter_once on;
        add_header Cache-Control "no-store";
    }

    # Reverse proxy to backend (used in prod compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
