name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write    # required for OIDC
  contents: read

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -B verify

  test-frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint || true
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build, push and deploy
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GymTrackerDeployRole
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/gym-tracker-backend:$SHA \
            -t $REGISTRY/gym-tracker-backend:latest \
            backend
          docker push $REGISTRY/gym-tracker-backend:$SHA
          docker push $REGISTRY/gym-tracker-backend:latest

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/gym-tracker-frontend:$SHA \
            -t $REGISTRY/gym-tracker-frontend:latest \
            frontend
          docker push $REGISTRY/gym-tracker-frontend:$SHA
          docker push $REGISTRY/gym-tracker-frontend:latest

      - name: Deploy to EC2 via AWS SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
          REGION: ${{ secrets.AWS_REGION }}
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          PARAMS=$(jq -n \
            --arg region "$REGION" \
            --arg registry "$REGISTRY" \
            --arg sha "$SHA" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/gym-tracker",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "export IMAGE_TAG=\($sha)",
              "export ECR_REGISTRY=\($registry)",
              "docker compose -f docker-compose.prod.yml --env-file .env pull",
              "docker compose -f docker-compose.prod.yml --env-file .env up -d",
              "docker image prune -f"
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${SHA::7}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "Command id: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || true)
            echo "Status: ${STATUS:-unknown}"
            case "${STATUS:-}" in
              Success|Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated) break ;;
            esac
          done

          if [[ "${STATUS:-}" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}" \
              --output json || true
            exit 1
          fi
